snapp-object-store:
  enabled: false
  fqdn: ""
  config:
    url: ""
    address: "0.0.0.0"
    port: 8080
    log_level: "warn"
    auth_enabled: "false"
    auth_token: ""
snapp-object-store-dev:
  enabled: false
  fqdn: ""
  config:
    url: ""
    address: "0.0.0.0"
    port: 8080
    log_level: "debug"
    auth_enabled: "false"
    auth_token: ""

# Name of an existing Secret holding the credentials for auth_mode "iam".
# Mounted with envFrom, so its keys become environment variables:
#   s3panel_oidc__client_secret   (omit for a public OIDC client)
#   s3panel_oidc__cookie_key      (REQUIRED in iam mode; openssl rand -base64 32)
#   s3panel_panel__api_key        (when config.panel.enabled; the app credential)
# Left empty the container gets no env, which is correct for auth_mode "s3".
existingSecret: ""

# Render this chart's own HTTPProxy. Disable when another HTTPProxy routes to the
# Service, e.g. the panel served at a path prefix of IAM's console host.
httpproxy:
  enabled: true
  # The Contour ingress class both HTTPProxies below are programmed on. For the
  # include-only proxy it must be the class of the root HTTPProxy that
  # includes it: Contour drops an include programmed on another class.
  ingressClassName: private
  # Serve the panel under this prefix of its own host (e.g. "/s3-panel", for an
  # image built with VITE_BASE_PATH=/s3-panel); "/" then redirects there. Empty
  # serves it at the root.
  pathPrefix: ""
  cors:
    # Credentialed CORS for ANY origin, which lets every website read the
    # panel's answers with the visitor's session. Off by default: the panel
    # serves its own frontend, so its pages are same-origin and need none. Turn
    # it on only for a frontend served from another host.
    enabled: false

  # An HTTPProxy with no virtualhost, for another chart's root HTTPProxy to
  # include: the panel at a path of a host it shares with other apps (a unified
  # console). Needs config.base_path, which must be the prefix the including
  # proxy routes to it; the prefix is not stripped. Independent of `enabled`
  # above, which is the panel's own host: during a move both may exist.
  include:
    enabled: false
    # Defaults to "<chart name>-include".
    name: ""
