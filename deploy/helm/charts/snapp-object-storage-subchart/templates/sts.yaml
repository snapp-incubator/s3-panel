{{- if .Values.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "snappobjectstore.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "snappobjectstore.name" . }}-backend
spec:
  replicas: {{ .Values.replica }}
  selector:
    matchLabels:
      app: {{ include "snappobjectstore.name" . }}-backend
  serviceName: {{ include "snappobjectstore.name" . }}-service
  template:
    metadata:
      labels:
        app: {{ include "snappobjectstore.name" . }}-backend
    spec:
      containers:
      - name: object-storage-backend
        image: {{ .Values.image }}
        args:
        - s3-panel
        - --configPath=/etc/object-store/config/config.toml
        {{- /*
          Credentials for auth_mode "iam". They are deliberately NOT in the
          ConfigMap: the rendered config.toml is readable by anyone who can read
          ConfigMaps, and these two are a client secret and a cookie-signing key.

          The Secret must carry:
            s3panel_oidc__client_secret   (omit for a public OIDC client)
            s3panel_oidc__cookie_key      (REQUIRED — openssl rand -base64 32)

          cookie_key is a hard startup requirement in iam mode, so without this
          block the panel cannot start in that mode at all.

          The reference is `optional` so the Secret may be named before it is
          created. A missing envFrom secretRef is otherwise a hard
          CreateContainerConfigError, which would take down a working
          auth_mode "s3" deployment whose only mistake was wiring the name
          ahead of the credential.

          That weakens nothing for auth_mode "iam": the app refuses to start
          without a cookie_key, so an absent Secret still fails there — and
          fails naming the setting that is missing.
        */}}
        {{- with .Values.existingSecret }}
        envFrom:
        - secretRef:
            name: {{ . | quote }}
            optional: true
        {{- end }}
        ports:
        - containerPort: {{ .Values.config.port }}
          protocol: TCP
          name: backend
        resources:
{{ toYaml .Values.resources | indent 12 }}
        volumeMounts:
        - mountPath: /etc/object-store/config/
          name: app-config
        - mountPath: {{ .Values.config.download_path | default "/tmp" }}
          name: data
      volumes:
      - name: app-config
        configMap:
          defaultMode: 420
          name: {{ include "snappobjectstore.name" . }}-app-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 50Gi
{{- end }}