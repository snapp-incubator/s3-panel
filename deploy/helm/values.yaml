snapp-object-store:
  enabled: false
  replica: 1
  image: image-registry.openshift-image-registry.svc:5000/snappcloud-unified-panel/snapp_object_store:0.2.1
  fqdn: ""
  resources:
    limits:
      cpu: 2
      memory: 4Gi
    requests:
      cpu: 1
      memory: 2Gi
  config:
    url: ""
    address: "0.0.0.0"
    port: 8080
    log_level: "warn"
    auth_enabled: "false"
    # Serve the embedded frontend (set false for API-only instances).
    serve_frontend: true
    # Name of the region this instance serves directly (e.g. "teh-1").
    region: ""
    # Map of other region name -> backend URL. When the frontend is served,
    # requests for those regions are reverse-proxied there. e.g.
    #   region_endpoints:
    #     teh-2: http://s3-panel.apps.private.okd4.teh-2.snappcloud.io
    region_endpoints: {}

    # How a caller is identified: "s3" (default, users supply their own S3
    # credentials) or "iam" (users sign in with OIDC and an S3-compatible control
    # endpoint decides what they may reach).
    auth_mode: "s3"

    # Refuse every operation that would modify the storage backend — uploads,
    # deletes, bucket creation. Browsing and downloads still work. Set this on
    # any instance pointed at storage it must not change (e.g. a staging panel
    # reading a production gateway); it overrides per-bucket permissions, which
    # a user may legitimately hold.
    read_only: false

    # --- auth_mode: "iam" only ---------------------------------------------
    #
    # A second S3-compatible endpoint used only for authorization metadata:
    # which buckets the caller may use, their usage, and their bucket policies.
    # Object bytes never pass through it.
    control_url: ""
    # Where short-lived object credentials come from (STS GetSessionToken).
    # Defaults to control_url with its last path segment replaced by "sts".
    sts_url: ""
    # IAM's JSON API, used to list the debug users an admin may act as.
    # Defaults to control_url's sibling "/api" (its last path segment replaced
    # by "api"). Empty keeps the default.
    iam_api_url: ""
    # The browser-facing address of the IAM console. When set, each bucket card
    # links to that bucket's page there, to manage who has access. Not derived
    # from control_url, which may be an in-cluster address. Empty hides the link.
    iam_console_url: ""

    # Serve the whole panel (SPA, API, sign-in, livez/readyz) under this path
    # prefix of its host, e.g. "/storage" on a host shared with other apps. The
    # image must be built with the same VITE_BASE_PATH, oidc.redirect_url must
    # point at <host><base_path>/auth/callback, and nothing in front may strip
    # the prefix: this chart's HTTPProxies route it through unchanged. Empty
    # serves the panel at the host's root.
    base_path: ""
    # Origins besides the panel's own that may send it state-changing requests.
    # Its own host, and requests with no Origin (scripts), are always accepted.
    trusted_origins: []

    # --- A unified console (optional, off by default) ------------------------
    #
    # Join a console serving several apps on one host, each at its own path
    # (base_path above), with one sign-in and a shared header. Requires
    # auth_mode "iam". The app credential (app_…) is a secret: put it in
    # `existingSecret` as s3panel_panel__api_key.
    panel:
      enabled: false
      # The key the console admitted this app under.
      app_key: "storage"
      # The console's JSON API base. Empty defaults to iam_api_url (or its
      # default).
      api_url: ""
      description: ""
      # Defaults: /panel/header/v1/header.js, "/" and "/signout".
      header_script: ""
      home_url: ""
      signout_url: ""
      # How often the manifest is registered again. Default 6h.
      register_interval: ""
      # Navigation in the console header; paths under base_path. Empty
      # defaults to the bucket list.
      nav: []
      #  - label: Buckets
      #    path: /storage/object-storage/s3-bucket/buckets
      # How the console opens catalog resources here. Each resource pattern
      # must be one the app was admitted for.
      links: []
      #  - resource: "ceph-*|bucket"
      #    path: "/storage/object-storage/s3-bucket/buckets/{name}?region={region}"

    oidc:
      issuer_url: ""
      client_id: ""
      redirect_url: ""
      cookie_name: "s3panel_session"
      cookie_secure: true
      groups_claim: "groups"
      # Groups whose members get the admin view. The control endpoint still
      # decides what they may actually see. Only a fallback: IAM's answer to
      # "is this person an admin" wins when the panel can ask it.
      admin_groups: []
      scopes: []
      post_login_redirect: "/"
      # client_secret and cookie_key are credentials: supply them as env vars
      # from a Secret, not here. Set `existingSecret` (below) to the name of a
      # Secret carrying:
      #   s3panel_oidc__client_secret   (omit for a public OIDC client)
      #   s3panel_oidc__cookie_key      (REQUIRED; openssl rand -base64 32)
      #   s3panel_panel__api_key        (when panel.enabled; the app credential)

# Creates the object-store-gitlab-ci ServiceAccount and binds it to
# registry-editor, so CI can push panel images into this namespace. The panel
# does not need it to run.
ciRegistryAccess:
  enabled: true
