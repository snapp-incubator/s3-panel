[logger]
level = "debug"

[server]
address = "0.0.0.0"
port = "8080"

# How a caller is identified.
#
#   "s3"  (default) — the user supplies their own S3 access key and secret key.
#                     The gateway is the only authorization layer, so a user sees
#                     exactly the buckets their own account owns. auth_token
#                     below is a single static bearer token in front of the whole
#                     API; it is not a user identity.
#
#   "iam"           — the user signs in with OIDC, and an S3-compatible control
#                     endpoint answers which buckets they may use and with what
#                     permission. Requires the [oidc] block and
#                     object_storage_config.control_url below.
auth_mode = "s3"

auth_enabled = "true"
auth_key_lookup = "header:Authorization"
auth_token = "XXX"

serve_frontend = true

# Origins besides the panel's own that may send it state-changing requests
# (POST, PUT, PATCH, DELETE). The panel refuses those from any other Origin,
# including "null"; its own host and requests with no Origin (scripts, curl) are
# always accepted. An origin listed in server_cors_config.allowed_origins counts
# too (the "*" wildcard does not). The Vite dev server needs no entry: its proxy
# presents the backend's own origin.
# trusted_origins = ["https://console.example.com"]

# Serve the whole panel (SPA, API, sign-in, health) under a path prefix of its
# host, e.g. when several apps share one host. Requests must reach the panel
# with the prefix still on (a proxy in front must not strip it), the frontend
# must be built with the same VITE_BASE_PATH, and oidc.redirect_url must point
# at <host><base_path>/auth/callback. The session cookie is scoped to it
# (Path=<base_path>), and a Path=/ session cookie from a root-mounted panel is
# expired at the next sign-in or sign-out. /health also stays at the root.
# Empty serves the panel at the host's root.
# base_path = "/storage"

# auth_mode = "iam" only: the browser-facing address of the IAM console. When
# set, each bucket card links to that bucket's page there, to manage who has
# access. Leave unset to hide the link.
# iam_console_url = "https://iam.example.com"

# The region this instance serves directly. In s3 mode, requests whose "region"
# header names another region are reverse-proxied to that region's backend. In
# iam mode nothing is proxied: one instance serves buckets in every region, and
# region_endpoints is unused.
# region = "teh-1"
# [server.region_endpoints]
# teh-2 = "https://s3-panel.teh-2.example"

# Cross-origin reads (CORS, with credentials). None by default: the panel serves
# its own frontend, so its pages are same-origin. List the origins of a frontend
# served from another host. Avoid "*": with credentials, browsers refuse it.
# [server_cors_config]
# allowed_origins = ["https://console.example.com"]

[object_storage_config]
# The gateway. Object operations go here — in iam mode, for buckets in this
# instance's own region; a bucket in another region is reached through the
# gateway the control endpoint names for it when minting its credential.
url = "https://s3.example.com"
access_key = ""
secret_key = ""

# --- auth_mode = "iam" only -------------------------------------------------
#
# A second S3-compatible endpoint used ONLY for authorization metadata: which
# buckets the caller may use, their usage, and their bucket policies. Splitting
# it from `url` is what lets an authorization service answer across every region
# at once without ever standing in the path of object bytes.
# control_url = "https://iam.example.com/s3"
#
# Where short-lived object credentials come from (AWS STS GetSessionToken).
# Defaults to control_url with its last path segment replaced by "sts".
# sts_url = "https://iam.example.com/sts"
#
# IAM's JSON API, used to list the debug users an admin may act as (non-
# production IAM only). Defaults to control_url's sibling "/api", i.e.
# control_url with its last path segment replaced by "api".
# iam_api_url = "https://iam.example.com/api"

# --- Share links ---------------------------------------------------------------
#
# The longest a share link may live, as a Go duration ("15m", "24h"). Unset or
# "0" adds no cap of its own: a link lasts as long as asked. In iam mode a link
# is signed with the person's short-lived session credential, so it can never
# outlive that credential — and signing out revokes it, which ends the link.
# When both apply the shorter wins, and the share dialog offers only durations
# within it. Override with s3panel_share__max_duration.
# [share]
# max_duration = "24h"

# --- auth_mode = "iam" only -------------------------------------------------
# [oidc]
# issuer_url = "https://keycloak.example.com/realms/snapp"
# client_id = "s3-panel"
# client_secret = ""
# redirect_url = "https://s3-panel.example.com/auth/callback"
#
# Base64 of 32 random bytes: openssl rand -base64 32
# cookie_key = ""
# The session cookie's name. Give each app sharing a host its own.
# cookie_name = "s3panel_session"
# cookie_secure = true            # set false only for plain-HTTP local dev
#
# scopes = ["email", "profile"]   # "openid" is always included
# groups_claim = "groups"
#
# Groups whose members get the panel's admin view. The control endpoint still
# decides what they may actually see; this only reveals the UI.
# admin_groups = ["Cloud"]
#
# Where a sign-in lands. A root-relative value is relative to base_path ("/"
# lands on the panel's own home).
# post_login_redirect = "/"

# --- Unified console (optional, off by default) ------------------------------
#
# Join a console that serves several apps under one host, each at its own path
# (server.base_path), with one sign-in and a shared header. Requires
# auth_mode = "iam". When enabled the panel:
#   - registers its manifest (description, version, nav, links, health paths)
#     with the console's app registry at startup, and every register_interval;
#   - asks the registry, by the person's OIDC subject, whether they may view the
#     app: at sign-in, then at most once a minute. If the registry cannot
#     answer, a yes from the last 10 minutes still stands; after that the panel
#     refuses ("No access" page, 403 for API calls);
#   - embeds the console's header above the app (header_script).
# Nothing here is needed to run the panel on its own.
#
# [panel]
# enabled = true
# app_key = "storage"                       # the key the console admitted the app under
# api_url = "https://iam.example.com/api"   # default: object_storage_config.iam_api_url
# # api_key: the app credential (app_…). A secret: set s3panel_panel__api_key.
# description = "Buckets, objects and share links"
# header_script = "/panel/header/v1/header.js"
# home_url = "/"
# signout_url = "/signout"
# register_interval = "6h"
#
# # Navigation in the console header. Paths must sit under base_path. Default:
# # the bucket list.
# [[panel.nav]]
# label = "Buckets"
# path = "/storage/object-storage/s3-bucket/buckets"
#
# # How the console opens catalog resources here. The resource pattern must be
# # one the app was admitted for. None by default. Point bucket links at
# # <base_path>/iam/buckets/{name}: it takes the control endpoint's name for a
# # bucket ("<tenant>--<bucket>", "<tenant>/<bucket>", a bare name or a whole
# # resource ID) and a region in any spelling, and redirects to the bucket's page.
# [[panel.links]]
# resource = "ceph-*|bucket"
# path = "/storage/iam/buckets/{name}?region={region}"
