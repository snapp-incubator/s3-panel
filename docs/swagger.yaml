definitions:
  github_com_snapp-incubator_S3-Panel_internal_storage.BucketCreateResponse:
    properties:
      created:
        type: boolean
    type: object
  github_com_snapp-incubator_S3-Panel_internal_storage.BucketDeleteResponse:
    properties:
      deleted:
        type: boolean
      has_objects:
        type: boolean
    type: object
  github_com_snapp-incubator_S3-Panel_internal_storage.BucketListResponse:
    properties:
      items:
        items:
          type: string
        type: array
      total_buckets:
        type: integer
      total_pages:
        type: integer
    type: object
  github_com_snapp-incubator_S3-Panel_internal_storage.BucketQuotaResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.SingleBucketQuotaResponse'
        type: array
      total_buckets:
        type: integer
      total_pages:
        type: integer
    type: object
  github_com_snapp-incubator_S3-Panel_internal_storage.ObjectDeleteResponse:
    properties:
      deleted:
        type: boolean
    type: object
  github_com_snapp-incubator_S3-Panel_internal_storage.ObjectDownloadResponse:
    properties:
      url:
        type: string
    type: object
  github_com_snapp-incubator_S3-Panel_internal_storage.ObjectHeadResponse:
    properties:
      exists:
        type: boolean
    type: object
  github_com_snapp-incubator_S3-Panel_internal_storage.ObjectListBody:
    properties:
      is_folder:
        type: boolean
      last_modified_timestamp:
        type: string
      name:
        type: string
      size_unit:
        type: string
      size_value:
        type: number
    type: object
  github_com_snapp-incubator_S3-Panel_internal_storage.ObjectListResponse:
    properties:
      is_truncated:
        description: IsTruncated reports that the listing continues past this page.
        type: boolean
      items:
        items:
          $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.ObjectListBody'
        type: array
      next_continuation_token:
        description: |-
          NextContinuationToken resumes the listing after this page. Empty on the
          last page.
        type: string
      total_matched_items:
        type: integer
      total_pages:
        type: integer
    type: object
  github_com_snapp-incubator_S3-Panel_internal_storage.ObjectShareLimitResponse:
    properties:
      max_seconds:
        description: |-
          MaxSeconds is the longest a link may live: the least of what remains of
          the credential that would sign it and share.max_duration. Zero means no
          cap applies.
        type: integer
      session_bound:
        description: |-
          SessionBound reports that a link would be signed with the person's
          session credential (iam mode), so it would also stop working when they
          sign out.
        type: boolean
    type: object
  github_com_snapp-incubator_S3-Panel_internal_storage.ObjectShareResponse:
    properties:
      expires_at:
        description: |-
          ExpiresAt is when the link stops working, as signed into it (RFC 3339,
          UTC). It is the EFFECTIVE expiry, after every cap — not the one asked for.
        type: string
      expires_in_seconds:
        description: ExpiresInSeconds is how long the link was signed for.
        type: integer
      session_bound:
        description: |-
          SessionBound reports that the link is signed with the person's session
          credential (iam mode), so it also stops working when they sign out.
        type: boolean
      url:
        type: string
    type: object
  github_com_snapp-incubator_S3-Panel_internal_storage.ObjectUploadResponse:
    properties:
      created:
        type: boolean
    type: object
  github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg:
    properties:
      message:
        type: string
    type: object
  github_com_snapp-incubator_S3-Panel_internal_storage.SingleBucketQuotaResponse:
    properties:
      access:
        type: string
      bucket:
        type: string
      hard_bytes:
        type: number
      hard_bytes_raw:
        type: integer
      hard_bytes_unit:
        type: string
      hard_objects:
        type: integer
      modify_time_stamp:
        type: string
      quota_enabled:
        type: boolean
      tenant:
        type: string
      used_bytes:
        type: number
      used_bytes_raw:
        type: integer
      used_bytes_unit:
        type: string
      used_objects:
        type: integer
    type: object
  github_com_snapp-incubator_S3-Panel_internal_storage.UserIdentificationResponse:
    properties:
      display_name:
        type: string
      suspended:
        type: integer
      team:
        type: string
      user_not_found:
        type: boolean
      userID:
        type: string
    type: object
  github_com_snapp-incubator_S3-Panel_internal_storage.UserQuotaResponse:
    properties:
      hard_buckets:
        type: integer
      hard_bytes:
        type: number
      hard_bytes_raw:
        type: integer
      hard_bytes_unit:
        type: string
      hard_objects:
        type: integer
      quota_enabled:
        type: boolean
      used_buckets:
        type: integer
      used_bytes:
        type: number
      used_bytes_raw:
        type: integer
      used_bytes_unit:
        type: string
      used_objects:
        type: integer
    type: object
  internal_api.ConfigResponse:
    properties:
      auth_mode:
        description: AuthMode is "s3" or "iam".
        type: string
      iam_console_url:
        description: |-
          IAMConsoleURL is where bucket cards link to manage access. Only reported
          in iam mode, and empty when the deployment has not configured it.
        type: string
      login_url:
        description: |-
          LoginURL is where the browser should go to start a login, base path
          included. Empty in s3 mode, where the user types credentials into the
          panel instead.
        type: string
      panel:
        allOf:
        - $ref: '#/definitions/internal_api.PanelInfo'
        description: |-
          Panel is set only when the panel is part of a unified console
          (panel.enabled), and tells the SPA to make room for the console's header.
      read_only:
        description: |-
          ReadOnly reports that every mutating operation is refused, so the UI can
          hide the controls rather than offer actions that will 403.
        type: boolean
      region:
        description: Region is the region this instance serves directly.
        type: string
    type: object
  internal_api.IAMBucketDetailResponse:
    properties:
      bucket:
        description: Bucket is the identifier every other panel call takes.
        type: string
      can_delete:
        type: boolean
      can_read:
        type: boolean
      can_write:
        type: boolean
      display_name:
        description: DisplayName is the bare bucket name, for the UI.
        type: string
      granted_via:
        description: GrantedVia names the team the access came from, when it was inherited.
        type: string
      num_objects:
        description: |-
          NumObjects and SizeBytes come from the storage backend's admin API; S3 has
          no verb that reports either.
        type: integer
      permissions:
        description: Permissions are what the caller may do, e.g. read, write, owner.
        items:
          type: string
        type: array
      policy:
        description: Policy is the bucket policy document, null when the bucket has
          none.
      policy_denied:
        type: boolean
      policy_present:
        description: |-
          PolicyPresent distinguishes "no policy" from "not allowed to read it":
          reading a policy takes more than read access, and the page shows the rest
          of the bucket either way.
        type: boolean
      quota_bytes:
        type: integer
      quota_objects:
        type: integer
      region:
        type: string
      resource_id:
        description: |-
          ResourceID is the bucket's IAM resource ID, for linking to its page in the
          IAM console. Empty when the control endpoint does not report one.
        type: string
      s3_name:
        description: |-
          S3Name is how the gateway addresses this bucket on its own S3 endpoint,
          which for a tenanted bucket is not the same string as Bucket.
        type: string
      size_bytes:
        type: integer
      tenant:
        type: string
    type: object
  internal_api.IAMBucketItem:
    properties:
      bucket:
        description: Bucket is the identifier every other panel call takes.
        type: string
      can_delete:
        type: boolean
      can_read:
        type: boolean
      can_write:
        type: boolean
      display_name:
        description: DisplayName is the bare bucket name, for the UI.
        type: string
      granted_via:
        description: GrantedVia names the team the access came from, when it was inherited.
        type: string
      permissions:
        description: Permissions are what the caller may do, e.g. read, write, owner.
        items:
          type: string
        type: array
      region:
        type: string
      resource_id:
        description: |-
          ResourceID is the bucket's IAM resource ID, for linking to its page in the
          IAM console. Empty when the control endpoint does not report one.
        type: string
      s3_name:
        description: |-
          S3Name is how the gateway addresses this bucket on its own S3 endpoint,
          which for a tenanted bucket is not the same string as Bucket.
        type: string
      tenant:
        type: string
    type: object
  internal_api.IAMBucketListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_api.IAMBucketItem'
        type: array
      regions:
        description: |-
          Regions is every region the caller has buckets in, whatever the listing
          was filtered by.
        items:
          type: string
        type: array
      total_buckets:
        type: integer
      total_pages:
        type: integer
    type: object
  internal_api.IAMUserIdentificationResponse:
    properties:
      display_name:
        type: string
      email:
        type: string
      groups:
        items:
          type: string
        type: array
      is_admin:
        type: boolean
      userID:
        type: string
    type: object
  internal_api.PanelInfo:
    properties:
      app_key:
        description: AppKey is this app's key in the console.
        type: string
      home_url:
        description: HomeURL and SignOutURL are the console's home and sign-out pages.
        type: string
      signout_url:
        type: string
    type: object
info:
  contact:
    name: snapp-incubator
    url: https://github.com/snapp-incubator/S3-Panel
  description: HTTP API for S3 Panel — managing S3-compatible object storage
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html
  termsOfService: https://swagger.io/terms/
  title: S3 Panel
  version: "1.0"
paths:
  /api/bucket/create:
    post:
      consumes:
      - application/json
      description: Creates bucket for a user
      parameters:
      - description: User given AccessKey
        in: header
        name: access_key
        required: true
        type: string
      - description: User given SecretKey
        in: header
        name: secret_key
        required: true
        type: string
      - description: Bucket Name to Create
        in: body
        name: bucket
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "201":
          description: Bucket created successfully
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.BucketCreateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Bucket Already Exists / Bucket creation quota exceeded
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "422":
          description: Action didn't complete
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
      summary: Creates Bucket
      tags:
      - Bucket
  /api/bucket/delete:
    delete:
      consumes:
      - application/json
      description: Deletes bucket for a user
      parameters:
      - description: User given AccessKey
        in: header
        name: access_key
        required: true
        type: string
      - description: User given SecretKey
        in: header
        name: secret_key
        required: true
        type: string
      - description: Bucket Name to Delete
        in: body
        name: bucket
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: Bucket deleted successfully
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.BucketDeleteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "401":
          description: Unauthorized
          schema:
            type: string
        "422":
          description: Action didn't complete
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
      summary: Deletes Bucket
      tags:
      - Bucket
  /api/bucket/detail:
    get:
      description: Object count, size, quota and bucket policy for one bucket. Requires
        server.auth_mode = "iam".
      parameters:
      - description: bucket identifier as returned by /bucket/list
        in: query
        name: bucket
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Bucket detail
          schema:
            $ref: '#/definitions/internal_api.IAMBucketDetailResponse'
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "404":
          description: No such bucket, or not accessible
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
      summary: 'Bucket detail: usage and policy'
      tags:
      - Bucket
  /api/bucket/list:
    get:
      description: Asks the control endpoint which buckets the caller can use, across
        every region, with the permissions they hold on each. Requires server.auth_mode
        = "iam".
      parameters:
      - description: filter by substring
        in: query
        name: search_string
        type: string
      - description: only buckets in this region
        in: query
        name: region
        type: string
      - description: page size
        in: query
        name: max_keys
        type: integer
      - description: page number
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Buckets the caller may access
          schema:
            $ref: '#/definitions/internal_api.IAMBucketListResponse'
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "502":
          description: Control endpoint unavailable
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
      summary: List the buckets the signed-in user may access
      tags:
      - Bucket
  /api/bucket/quota:
    get:
      consumes:
      - application/json
      description: Fetches Quota of buckets owned by a user that is specified by AccessKey.
        if status code is 200 and the BucketQuotaResponse hard_bytes or hard_objects
        is -1, mean no limitation on quota_storage or quota_objects is applied.
      parameters:
      - description: User given AccessKey
        in: header
        name: access_key
        required: true
        type: string
      - description: User given SecretKey
        in: header
        name: secret_key
        required: true
        type: string
      - description: search by given string, could be empty
        in: query
        name: search_string
        type: string
      - description: max keys in a page
        in: query
        name: max_keys
        type: string
      - description: page number
        in: query
        name: page
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful response with buckets quota
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.BucketQuotaResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "401":
          description: Unauthorized
          schema:
            type: string
        "422":
          description: Action didn't complete
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
      summary: Quota of buckets of a user
      tags:
      - Bucket
  /api/config:
    get:
      description: Reports which authentication mode this instance runs, so a client
        knows whether to present a credential form or an OIDC sign-in.
      produces:
      - application/json
      responses:
        "200":
          description: Panel configuration
          schema:
            $ref: '#/definitions/internal_api.ConfigResponse'
      summary: Panel configuration
      tags:
      - Config
  /api/object/delete:
    delete:
      consumes:
      - application/json
      description: Deletes a list of objects specified by name
      parameters:
      - description: User given AccessKey
        in: header
        name: access_key
        required: true
        type: string
      - description: User given SecretKey
        in: header
        name: secret_key
        required: true
        type: string
      - description: bucket name
        in: query
        name: bucket
        required: true
        type: string
      - collectionFormat: csv
        description: objects names
        in: query
        items:
          type: string
        name: objects
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Successful response with objects delete
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.ObjectDeleteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Object Does not exist
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "422":
          description: Action didn't complete
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
      summary: Deletes the list of objects inside a bucket
      tags:
      - Object
  /api/object/download:
    get:
      consumes:
      - application/json
      description: This functions downloads an object from bucket.
      parameters:
      - description: User given AccessKey
        in: header
        name: access_key
        required: true
        type: string
      - description: User given SecretKey
        in: header
        name: secret_key
        required: true
        type: string
      - description: bucket name
        in: query
        name: bucket
        required: true
        type: string
      - description: object name
        in: query
        name: object
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful response with bucket download
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.ObjectDownloadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "401":
          description: Unauthorized
          schema:
            type: string
        "422":
          description: Action didn't complete
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
      summary: download an object to bucket
      tags:
      - Object
  /api/object/head:
    get:
      consumes:
      - application/json
      description: check if an object exists
      parameters:
      - description: User given AccessKey
        in: header
        name: access_key
        required: true
        type: string
      - description: User given SecretKey
        in: header
        name: secret_key
        required: true
        type: string
      - description: bucket name
        in: body
        name: bucket
        required: true
        schema:
          type: string
      - description: objects name
        in: body
        name: object
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful response with objects head
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.ObjectHeadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "401":
          description: Unauthorized
          schema:
            type: string
        "422":
          description: Action didn't complete
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
      summary: check if an object exists
      tags:
      - Object
  /api/object/list:
    get:
      consumes:
      - application/json
      description: Fetches list of buckets owned by a user that is specified by AccessKey
        and SecretKey
      parameters:
      - description: User given AccessKey
        in: header
        name: access_key
        required: true
        type: string
      - description: User given SecretKey
        in: header
        name: secret_key
        required: true
        type: string
      - description: bucket name
        in: query
        name: bucket
        required: true
        type: string
      - description: max_keys of pagination
        in: query
        name: max_keys
        required: true
        type: string
      - description: page number; without continuation_token, page N is reached by
          skipping N-1 pages
        in: query
        name: page
        type: string
      - description: next_continuation_token from the previous page
        in: query
        name: continuation_token
        type: string
      - description: search by given string, could be empty
        in: query
        name: search_string
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful response with bucket list
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.ObjectListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "401":
          description: Unauthorized
          schema:
            type: string
        "422":
          description: Action didn't complete
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
      summary: List of objects of a bucket
      tags:
      - Object
  /api/object/share:
    post:
      consumes:
      - application/json
      description: This function uses the PreSign feature of S3 to share object link
        with expiration time with users
      parameters:
      - description: User given AccessKey
        in: header
        name: access_key
        required: true
        type: string
      - description: User given SecretKey
        in: header
        name: secret_key
        required: true
        type: string
      - description: bucket name
        in: query
        name: bucket
        required: true
        type: string
      - description: objects name
        in: query
        name: object
        required: true
        type: string
      - default: 1h
        description: URL expiration time
        in: query
        name: expiration
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: The link, and when it stops working (the effective expiry,
            after every cap)
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.ObjectShareResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "401":
          description: Unauthorized
          schema:
            type: string
