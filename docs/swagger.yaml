info:
  contact:
    name: snapp-incubator
    url: https://github.com/snapp-incubator/S3-Panel
  description: HTTP API for S3 Panel — managing S3-compatible object storage
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html
  termsOfService: https://swagger.io/terms/
  title: S3 Panel
  version: "1.0"
paths:
  /api/bucket/create:
    post:
      consumes:
      - application/json
      description: Creates bucket for a user
      parameters:
      - description: User given AccessKey
        in: header
        name: access_key
        required: true
        type: string
      - description: User given SecretKey
        in: header
        name: secret_key
        required: true
        type: string
      - description: Bucket Name to Create
        in: body
        name: bucket
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "201":
          description: Bucket created successfully
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.BucketCreateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Bucket Already Exists / Bucket creation quota exceeded
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "422":
          description: Action didn't complete
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
      summary: Creates Bucket
      tags:
      - Bucket
  /api/bucket/delete:
    delete:
      consumes:
      - application/json
      description: Deletes bucket for a user
      parameters:
      - description: User given AccessKey
        in: header
        name: access_key
        required: true
        type: string
      - description: User given SecretKey
        in: header
        name: secret_key
        required: true
        type: string
      - description: Bucket Name to Delete
        in: body
        name: bucket
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: Bucket deleted successfully
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.BucketDeleteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "401":
          description: Unauthorized
          schema:
            type: string
        "422":
          description: Action didn't complete
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
      summary: Deletes Bucket
      tags:
      - Bucket
  /api/bucket/list:
    get:
      consumes:
      - application/json
      description: Fetches list of buckets owned by a user that is specified by AccessKey
        and SecretKey
      parameters:
      - description: User given AccessKey
        in: header
        name: access_key
        required: true
        type: string
      - description: User given SecretKey
        in: header
        name: secret_key
        required: true
        type: string
      - description: search by given string, could be empty
        in: query
        name: search_string
        type: string
      - description: max keys in a page
        in: query
        name: max_keys
        type: string
      - description: page number
        in: query
        name: page
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful response with bucket list
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.BucketListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "401":
          description: Unauthorized
          schema:
            type: string
        "422":
          description: Action didn't complete
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
      summary: List of buckets of a user
      tags:
      - Bucket
  /api/bucket/quota:
    get:
      consumes:
      - application/json
      description: Fetches Quota of buckets owned by a user that is specified by AccessKey.
        if status code is 200 and the BucketQuotaResponse hard_bytes or hard_objects
        is -1, mean no limitation on quota_storage or quota_objects is applied.
      parameters:
      - description: User given AccessKey
        in: header
        name: access_key
        required: true
        type: string
      - description: User given SecretKey
        in: header
        name: secret_key
        required: true
        type: string
      - description: search by given string, could be empty
        in: query
        name: search_string
        type: string
      - description: max keys in a page
        in: query
        name: max_keys
        type: string
      - description: page number
        in: query
        name: page
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful response with buckets quota
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.BucketQuotaResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "401":
          description: Unauthorized
          schema:
            type: string
        "422":
          description: Action didn't complete
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
      summary: Quota of buckets of a user
      tags:
      - Bucket
  /api/object/delete:
    delete:
      consumes:
      - application/json
      description: Deletes a list of objects specified by name
      parameters:
      - description: User given AccessKey
        in: header
        name: access_key
        required: true
        type: string
      - description: User given SecretKey
        in: header
        name: secret_key
        required: true
        type: string
      - description: bucket name
        in: query
        name: bucket
        required: true
        type: string
      - collectionFormat: csv
        description: objects names
        in: query
        items:
          type: string
        name: objects
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Successful response with objects delete
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.ObjectDeleteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Object Does not exist
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "422":
          description: Action didn't complete
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
      summary: Deletes the list of objects inside a bucket
      tags:
      - Object
  /api/object/download:
    get:
      consumes:
      - application/json
      description: This functions downloads an object from bucket.
      parameters:
      - description: User given AccessKey
        in: header
        name: access_key
        required: true
        type: string
      - description: User given SecretKey
        in: header
        name: secret_key
        required: true
        type: string
      - description: bucket name
        in: query
        name: bucket
        required: true
        type: string
      - description: object name
        in: query
        name: object
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful response with bucket download
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.ObjectDownloadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "401":
          description: Unauthorized
          schema:
            type: string
        "422":
          description: Action didn't complete
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
      summary: download an object to bucket
      tags:
      - Object
  /api/object/head:
    get:
      consumes:
      - application/json
      description: check if an object exists
      parameters:
      - description: User given AccessKey
        in: header
        name: access_key
        required: true
        type: string
      - description: User given SecretKey
        in: header
        name: secret_key
        required: true
        type: string
      - description: bucket name
        in: body
        name: bucket
        required: true
        schema:
          type: string
      - description: objects name
        in: body
        name: object
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful response with objects head
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.ObjectHeadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "401":
          description: Unauthorized
          schema:
            type: string
        "422":
          description: Action didn't complete
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
      summary: check if an object exists
      tags:
      - Object
  /api/object/list:
    get:
      consumes:
      - application/json
      description: Fetches list of buckets owned by a user that is specified by AccessKey
        and SecretKey
      parameters:
      - description: User given AccessKey
        in: header
        name: access_key
        required: true
        type: string
      - description: User given SecretKey
        in: header
        name: secret_key
        required: true
        type: string
      - description: bucket name
        in: query
        name: bucket
        required: true
        type: string
      - description: max_keys of pagination
        in: query
        name: max_keys
        required: true
        type: string
      - description: page of pagination
        in: query
        name: page
        required: true
        type: string
      - description: search by given string, could be empty
        in: query
        name: search_string
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful response with bucket list
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.ObjectListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "401":
          description: Unauthorized
          schema:
            type: string
        "422":
          description: Action didn't complete
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
      summary: List of objects of a bucket
      tags:
      - Object
  /api/object/share:
    post:
      consumes:
      - application/json
      description: This function uses the PreSign feature of S3 to share object link
        with expiration time with users
      parameters:
      - description: User given AccessKey
        in: header
        name: access_key
        required: true
        type: string
      - description: User given SecretKey
        in: header
        name: secret_key
        required: true
        type: string
      - description: bucket name
        in: query
        name: bucket
        required: true
        type: string
      - description: objects name
        in: query
        name: object
        required: true
        type: string
      - default: 1h
        description: URL expiration time
        in: query
        name: expiration
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful response with object url
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.ObjectShareResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "401":
          description: Unauthorized
          schema:
            type: string
        "422":
          description: Action didn't complete
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
      summary: share the preSign address of object
      tags:
      - Object
  /api/object/upload:
    post:
      consumes:
      - multipart/form-data
      description: This functions uploads an object to bucket.
      parameters:
      - description: User given AccessKey
        in: header
        name: access_key
        required: true
        type: string
      - description: User given SecretKey
        in: header
        name: secret_key
        required: true
        type: string
      - description: bucket name
        in: formData
        name: bucket
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful response with bucket upload
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.ObjectUploadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "409":
          description: Already Exists
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "422":
          description: Action didn't complete
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
      summary: upload an object to bucket
      tags:
      - Object
  /api/user/id:
    get:
      consumes:
      - application/json
      description: Fetch User Identification information using AccessKey
      parameters:
      - description: User given AccessKey
        in: header
        name: access_key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful response with user identification
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.UserIdentificationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "401":
          description: Unauthorized
          schema:
            type: string
        "422":
          description: Action didn't complete
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
      summary: Fetch User Identification information using AccessKey
      tags:
      - User
  /api/user/quota:
    get:
      consumes:
      - application/json
      description: Fetches Quota Information
      parameters:
      - description: User given AccessKey
        in: header
        name: access_key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful response with user quota
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.UserQuotaResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "401":
          description: Unauthorized
          schema:
            type: string
        "422":
          description: Action didn't complete
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.OperationErrWithMsg'
      summary: Fetch User Quota from AccessKey
      tags:
      - User
swagger: "2.0"
