  github_com_snapp-incubator_S3-Panel_internal_storage.BucketQuotaResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_snapp-incubator_S3-Panel_internal_storage.SingleBucketQuotaResponse'
