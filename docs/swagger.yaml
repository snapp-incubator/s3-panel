  github_com_snapp-incubator_S3-Panel_internal_storage.ObjectShareResponse:
    properties:
      url:
        type: string
    type: object
  github_com_snapp-incubator_S3-Panel_internal_storage.ObjectUploadResponse:
    properties:
      created:
